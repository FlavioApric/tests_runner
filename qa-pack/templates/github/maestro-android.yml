# TEMPLATE (qa-pack): Maestro series on an Android emulator in GitHub Actions. Copy to .github/workflows/ and fill the
# {{...}} placeholders (plans.mjs renders them from qa.config.json into qa/plans/mobile.md). Actions are pinned by SHA.
# Never runs on the default branch and uses no production secret: the APK is a DEBUG build of this commit that talks to
# a throwaway local backend on the runner, reached by the emulator through `adb reverse`.
name: Maestro Android series

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Consecutive green runs required'
        required: true
        default: '{{RUNS}}'

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro:
    name: Maestro series (Android API {{API_LEVEL}})
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      IN_RUNS: ${{ inputs.runs || '{{RUNS}}' }}
      MAESTRO_VERSION: '{{MAESTRO_VERSION}}'
      MAESTRO_ZIP_SHA256: '{{MAESTRO_SHA256}}'
    steps:
      - name: Validate inputs
        run: |
          case "$IN_RUNS" in ''|*[!0-9]*) echo "::error::runs must be a positive integer"; exit 1;; esac
          if [ "$IN_RUNS" -lt 1 ] || [ "$IN_RUNS" -gt 200 ]; then echo "::error::runs out of range (1-200)"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node {{NODE}}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '{{NODE}}'

      - name: Install Maestro CLI (pinned version and checksum)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Start the local stack
        working-directory: {{PROJECT_DIR}}
        run: {{STACK_UP}}

      - name: Build the debug APK
        working-directory: {{PROJECT_DIR}}
        run: {{BUILD}}

      - name: Run the Maestro series on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: {{API_LEVEL}}
          target: {{TARGET}}
          arch: x86_64
          profile: {{PROFILE}}
          disable-animations: true
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: {{PROJECT_DIR}}
          script: for p in {{REVERSE_PORTS}}; do adb reverse tcp:$p tcp:$p; done; adb install -r {{APK}} && node {{PACK}}/scripts/maestro-run.mjs --runs "$IN_RUNS" --fresh

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-evidence
          path: {{PROJECT_DIR}}/{{OUT}}
          retention-days: 14
          if-no-files-found: warn
