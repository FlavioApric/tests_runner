# tests_runner coordinator: plans the units of a private source over every runner repo of the fleet, dispatches,
# watches, retries infrastructure failures once elsewhere, and bundles the SEALED results.
# - only workflow_dispatch, only from main, only where vars.FLEET_COORDINATOR == 'true' (your repo, not a fork or a copy)
# - the job runs in the Environment "fleet": GitHub waits for YOUR approval before it can read any secret
# - the card arrives sealed (FLEET_CARD_SEALED) and is opened in memory with FLEET_CARD_KEY; every token is masked
# - the coordinator has no private result key: the bundle holds encrypted archives + public unit states only.
#   Decrypt on your PC:  node cli/fleet.mjs pull --gh-run <this run id>
name: tests_runner coordinator
run-name: coordinate ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      source: { description: 'Source name from the card, or owner/repo', required: true, type: string }
      ref: { description: 'Pushed branch, tag or SHA of the source to test', required: true, type: string }
      only: { description: 'Comma separated unit or step ids (empty = all)', required: false, type: string, default: '' }
      tags: { description: 'Comma separated tags (empty = all)', required: false, type: string, default: '' }

permissions:
  contents: read

concurrency:
  group: coordinate-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  coordinate:
    name: coordinate
    if: vars.FLEET_COORDINATOR == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 420
    environment: fleet
    env:
      IN_SOURCE: ${{ inputs.source }}
      IN_REF: ${{ inputs.ref }}
      IN_ONLY: ${{ inputs.only }}
      IN_TAGS: ${{ inputs.tags }}
    steps:
      - name: Validate inputs
        run: |
          set -eu
          ok() { printf '%s' "$1" | grep -Eq "$2"; }
          ok "$IN_SOURCE" '^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)?$' || { echo "::error::bad source"; exit 1; }
          ok "$IN_REF" '^[A-Za-z0-9._/-]{1,200}$' || { echo "::error::bad ref"; exit 1; }
          case "$IN_REF" in *..*|-*) echo "::error::bad ref"; exit 1;; esac
          ok "$IN_ONLY" '^[A-Za-z0-9._,-]{0,4000}$' || { echo "::error::bad only"; exit 1; }
          ok "$IN_TAGS" '^[A-Za-z0-9._,-]{0,1000}$' || { echo "::error::bad tags"; exit 1; }

      - name: Checkout fleet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }

      - name: Coordinate (tokens are masked before anything else runs)
        id: c
        env:
          FLEET_CARD_SEALED: ${{ secrets.FLEET_CARD_SEALED }}
          FLEET_CARD_KEY: ${{ secrets.FLEET_CARD_KEY }}
        run: node cli/fleet.mjs coordinate --source "$IN_SOURCE" --ref "$IN_REF" --only "$IN_ONLY" --tags "$IN_TAGS" --out "$RUNNER_TEMP/fleet-out"

      - name: Upload sealed bundle
        if: always() && steps.c.outputs.bundle != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fleet-bundle
          path: ${{ steps.c.outputs.bundle }}
          retention-days: 3
          if-no-files-found: error
